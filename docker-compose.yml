services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pixprotect
      POSTGRES_USER: pixprotect
      POSTGRES_PASSWORD: pixprotect
    ports:
      - "5432:5432"
    volumes:
      - pixprotect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixprotect -d pixprotect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pixprotect_pgdata:
